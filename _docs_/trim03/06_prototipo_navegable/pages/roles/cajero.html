<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel del cajero - Control Store</title>
    <!-- Mismo esqueleto que admin.html y domiciliario.html (dashboard.css) -->
    <link rel="stylesheet" href="../../assets/vendor/bootstrap/css/bootstrap.min.css">
    <link rel="stylesheet" href="../../assets/vendor/bootstrap-icons/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../../assets/css/fonts.css">
    <link rel="stylesheet" href="../../assets/css/dashboard.css">
</head>

<body>

    <div class="dashboard">
        <aside class="sidebar">
            <div class="sidebar-brand">
                <i class="bi bi-shop"></i>
                <div>
                    <div class="sidebar-brand-name">Control Store</div>
                    <div class="sidebar-brand-sub">Panel del cajero</div>
                </div>
            </div>

            <!-- Solo las opciones del rol cajero (actor Cajero del Módulo 3) -->
            <nav class="sidebar-nav">
                <div class="sidebar-label">Ventas</div>
                <a href="../modules/sales/registrar_venta.html" target="area_trabajo" class="sidebar-link active">
                    <i class="bi bi-cart"></i> Punto de venta
                </a>
                <a href="../modules/sales/listar_ventas.html" target="area_trabajo" class="sidebar-link">
                    <i class="bi bi-receipt"></i> Historial de ventas
                </a>
                <a href="../modules/sales/cierre_caja.html" target="area_trabajo" class="sidebar-link">
                    <i class="bi bi-safe"></i> Cierre de caja
                </a>
            </nav>
        </aside>

        <div class="dashboard-main">
            <header class="topbar">
                <div class="topbar-search">
                    <i class="bi bi-search"></i>
                    <input type="text" placeholder="Buscar producto...">
                </div>

                <!-- Perfil con nombre y rol. Docs: https://getbootstrap.com/docs/5.3/components/dropdowns/ -->
                <div class="topbar-actions d-flex align-items-center gap-2">
                    <div class="dropdown">
                        <button class="btn border d-flex align-items-center gap-2 dropdown-toggle" type="button"
                            data-bs-toggle="dropdown" aria-expanded="false">
                            <i class="bi bi-person-circle fs-5"></i>
                            <span class="text-start lh-sm">
                                <!-- Cajero real de la BD: usuarios.id_usuario = 2 -->
                                <span class="d-block small fw-semibold">Juan Carlos Pérez</span>
                                <span class="d-block small text-body-secondary">Cajero</span>
                            </span>
                        </button>
                        <ul class="dropdown-menu dropdown-menu-end">
                            <li>
                                <a class="dropdown-item" href="../modules/perfil/cambiar_contrasena.html" target="area_trabajo">
                                    <i class="bi bi-key"></i> Cambiar contraseña
                                </a>
                            </li>
                            <li><hr class="dropdown-divider"></li>
                            <li>
                                <button type="button" class="dropdown-item" data-bs-toggle="modal" data-bs-target="#modalCerrarSesion">
                                    <i class="bi bi-box-arrow-right"></i> Cerrar sesión
                                </button>
                            </li>
                        </ul>
                    </div>
                </div>
            </header>

            <main class="content">
                <iframe name="area_trabajo" src="../modules/sales/registrar_venta.html" class="content-frame"></iframe>
            </main>
        </div>
    </div>

    <!-- Mismos id que en admin.html: así se reutiliza dashboard.js. Docs: https://getbootstrap.com/docs/5.3/components/modal/ -->
    <div class="modal fade" id="modalCerrarSesion" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Cerrar sesión</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
                </div>
                <div class="modal-body">¿Desea cerrar la sesión?</div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">No</button>
                    <button type="button" class="btn btn-danger" id="confirmarCerrarSesion">Sí</button>
                </div>
            </div>
        </div>
    </div>

    <script src="../../assets/vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
    <script src="../../assets/js/dashboard.js"></script>
</body>

</html>
