<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reporte gráfico de usuarios - Control Store</title>
    <link rel="stylesheet" href="../../../assets/vendor/bootstrap/css/bootstrap.min.css">
    <link rel="stylesheet" href="../../../assets/vendor/bootstrap-icons/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../../../assets/css/fonts.css">
    <link rel="stylesheet" href="../../../assets/css/dashboard.css">
    <!-- Tema visual del diseño: va de último para que mande sobre los demás estilos -->
    <link rel="stylesheet" href="../../../assets/css/tema_control_store.css">
</head>

<!-- CS-27 · Reporte gráfico de usuarios (solo administrador): desempeño de los vendedores y
     composición de las cuentas. Lo dibuja reporte_grafico_usuarios.js con ServicioReportes. -->
<body class="content-body">

    <nav aria-label="breadcrumb">
        <ol class="breadcrumb">
            <li class="breadcrumb-item">Reportes</li>
            <li class="breadcrumb-item active" aria-current="page">Gráfico de usuarios</li>
        </ol>
    </nav>

    <ul class="nav nav-pills mb-3">
        <li class="nav-item"><a class="nav-link" href="reporte_grafico_ventas.html">Ventas</a></li>
        <li class="nav-item"><a class="nav-link" href="reporte_rotacion_inventario.html">Inventario</a></li>
        <li class="nav-item"><a class="nav-link active" aria-current="page" href="reporte_grafico_usuarios.html">Usuarios</a></li>
        <li class="nav-item"><a class="nav-link" href="reporte_domicilios.html">Domicilios</a></li>
    </ul>

    <!-- Filtro de fechas (solo afecta las ventas). Docs: https://getbootstrap.com/docs/5.3/forms/layout/#gutters -->
    <form class="card card-body mb-3" id="formFiltros">
        <div class="row g-2 align-items-end">
            <div class="col-sm-6 col-lg-3">
                <label for="filtroDesde" class="form-label small">Ventas desde</label>
                <input type="date" class="form-control" id="filtroDesde">
            </div>
            <div class="col-sm-6 col-lg-3">
                <label for="filtroHasta" class="form-label small">Ventas hasta</label>
                <input type="date" class="form-control" id="filtroHasta">
            </div>
        </div>
    </form>

    <!-- Vendedor destacado: el de más ventas del periodo. Docs: https://getbootstrap.com/docs/5.3/components/alerts/ -->
    <div class="alert alert-primary d-flex align-items-center gap-2" role="alert" id="destacado">
        <i class="bi bi-trophy-fill fs-5"></i>
        <div id="textoDestacado"></div>
    </div>

    <div class="row g-3">
        <div class="col-lg-6">
            <div class="card h-100">
                <div class="card-header">Total vendido por vendedor</div>
                <div class="card-body">
                    <div id="graficoTotal"></div>
                    <p class="small text-body-secondary mt-3 mb-0">Valor: total en COP, sin ventas anuladas</p>
                </div>
            </div>
        </div>
        <div class="col-lg-6">
            <div class="card h-100">
                <div class="card-header">Número de ventas por vendedor</div>
                <div class="card-body" id="graficoNumero"></div>
            </div>
        </div>
        <!-- Usuarios por rol: barra apilada en lugar de torta -->
        <div class="col-lg-6">
            <div class="card h-100">
                <div class="card-header">Usuarios por rol</div>
                <div class="card-body" id="graficoRoles"></div>
            </div>
        </div>
        <div class="col-lg-6">
            <div class="card h-100">
                <div class="card-header">Usuarios activos e inactivos</div>
                <div class="card-body" id="graficoEstado"></div>
            </div>
        </div>
    </div>

    <script src="../../../assets/vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
    <script src="../../../assets/js/auditoria/auditoria_datos.js"></script>
    <script src="../../../assets/js/usuarios/usuarios_datos.js"></script>
    <script src="../../../assets/js/inventario/inventario_datos.js"></script>
    <script src="../../../assets/js/catalogos/catalogos_datos.js"></script>
    <script src="../../../assets/js/ventas/ventas_datos.js"></script>
    <script src="../../../assets/js/reportes/reportes_servicio.js"></script>
    <script src="../../../assets/js/reportes/reportes_graficos.js"></script>
    <script src="../../../assets/js/reportes/reporte_grafico_usuarios.js"></script>
</body>

</html>
