<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alerta de Stock - Control Store</title>
    <link rel="stylesheet" href="../../../assets/vendor/bootstrap/css/bootstrap.min.css">
    <link rel="stylesheet" href="../../../assets/vendor/bootstrap-icons/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../../../assets/css/dashboard.css">
</head>
<body class="content-body">

    <nav aria-label="breadcrumb">
        <ol class="breadcrumb">
            <li class="breadcrumb-item"><a href="../_mains_/dashboard_inicio.html" target="_self">Inicio</a></li>
            <li class="breadcrumb-item"><a href="listar_productos.html" target="_self">Inventario</a></li>
            <li class="breadcrumb-item active" aria-current="page">Alerta de stock</li>
        </ol>
    </nav>

    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h1 class="h4"><i class="bi bi-exclamation-triangle text-warning"></i> Alerta de stock</h1>
            <p class="text-muted mb-0">Módulo Inventario</p>
        </div>
        <!-- window.print() no necesita backend: cubre el "exportar/imprimir" que pide CS-17 -->
        <button type="button" class="btn btn-outline-secondary" id="botonImprimir">
            <i class="bi bi-printer"></i> Imprimir
        </button>
    </div>

    <!-- NOTA: CS-17 tambien pide alertar productos proximos a vencer, pero la tabla `productos`
         no tiene columna de fecha de vencimiento. Esa parte no se implementa hasta que exista
         esa columna en la base de datos (ver bitacora). -->

    <div class="table-responsive">
        <table class="table table-hover align-middle">
            <thead>
                <tr>
                    <th>Código</th>
                    <th>Nombre</th>
                    <th>Categoría</th>
                    <th>Stock actual</th>
                    <th>Stock mínimo</th>
                    <th>Alerta</th>
                </tr>
            </thead>
            <tbody id="cuerpoAlertas"></tbody>
        </table>
    </div>

    <div id="sinAlertas" class="alert alert-success text-center d-none">
        <i class="bi bi-check-circle"></i> No hay productos en alerta de stock
    </div>

    <script src="../../../assets/vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
    <script src="../../../assets/js/alertas_stock.js"></script>
</body>
</html>
