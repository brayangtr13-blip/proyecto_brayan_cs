<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Producto - Control Store</title>
    <link rel="stylesheet" href="../../../assets/vendor/bootstrap/css/bootstrap.min.css">
    <link rel="stylesheet" href="../../../assets/vendor/bootstrap-icons/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../../../assets/css/dashboard.css">
</head>
<body class="content-body">

    <nav aria-label="breadcrumb">
        <ol class="breadcrumb">
            <li class="breadcrumb-item"><a href="../_mains_/dashboard_inicio.html" target="_self">Inicio</a></li>
            <li class="breadcrumb-item"><a href="listar_productos.html" target="_self">Inventario</a></li>
            <li class="breadcrumb-item active" aria-current="page">Editar producto</li>
        </ol>
    </nav>

    <div class="mb-4">
        <h1 class="h4"><i class="bi bi-pencil-square text-primary"></i> Editar producto</h1>
        <p class="text-muted mb-0">Módulo Inventario</p>
    </div>

    <div id="edicionExito" class="alert alert-success d-none" role="alert">
        Producto actualizado correctamente
    </div>

    <form id="formEditarProducto" novalidate>
        <div class="row g-3">

            <!-- disabled: CS-15 dice explicitamente que el codigo de barras no se puede editar,
                 por ser la llave primaria de la tabla productos -->
            <div class="col-md-4">
                <label for="codigoProducto" class="form-label">Código de barras</label>
                <input type="text" class="form-control" id="codigoProducto" name="codigoProducto" disabled>
            </div>

            <div class="col-md-8">
                <label for="nombre" class="form-label">Nombre</label>
                <input type="text" class="form-control" id="nombre" name="nombre" required>
                <div class="invalid-feedback">Este campo es obligatorio</div>
            </div>

            <div class="col-md-6">
                <label for="categoria" class="form-label">Categoría</label>
                <select class="form-select" id="categoria" name="categoria" required>
                    <option value="lacteos">Lácteos</option>
                    <option value="abarrotes">Abarrotes</option>
                    <option value="bebidas">Bebidas</option>
                    <option value="panaderia">Panadería</option>
                    <option value="aseo">Aseo</option>
                </select>
            </div>

            <div class="col-md-6">
                <label for="unidadMedida" class="form-label">Unidad de medida</label>
                <select class="form-select" id="unidadMedida" name="unidadMedida" required>
                    <option value="unidad">Unidad</option>
                    <option value="kilogramo">Kilogramo</option>
                    <option value="litro">Litro</option>
                    <option value="paquete">Paquete</option>
                </select>
            </div>

            <!-- min="0": misma validacion de "precios positivos" que pide CS-15, adaptada
                 a que este proyecto no maneja precio de compra, solo precio de venta -->
            <div class="col-md-4">
                <label for="precioUnitario" class="form-label">Precio de venta (COP)</label>
                <input type="number" class="form-control" id="precioUnitario" name="precioUnitario"
                    min="0" step="50" required>
                <div class="invalid-feedback">Ingresa un precio válido</div>
            </div>

            <!-- min="0": "stock entero no negativo", tal cual lo pide el criterio de aceptacion -->
            <div class="col-md-4">
                <label for="stockActual" class="form-label">Stock actual</label>
                <input type="number" class="form-control" id="stockActual" name="stockActual"
                    min="0" required>
                <div class="invalid-feedback">Ingresa una cantidad válida</div>
            </div>

            <div class="col-md-4">
                <label for="stockMinimo" class="form-label">Stock mínimo</label>
                <input type="number" class="form-control" id="stockMinimo" name="stockMinimo"
                    min="0" required>
                <div class="invalid-feedback">Ingresa una cantidad válida</div>
            </div>

            <div class="col-12">
                <label for="descripcion" class="form-label">Descripción <span class="text-muted">(opcional)</span></label>
                <textarea class="form-control" id="descripcion" name="descripcion" rows="2"></textarea>
            </div>

            <div class="col-md-6">
                <label for="estado" class="form-label">Estado</label>
                <select class="form-select" id="estado" name="estado" required>
                    <option value="activo">Activo</option>
                    <option value="inactivo">Inactivo</option>
                </select>
            </div>

        </div>

        <div class="mt-4">
            <button type="submit" class="btn btn-primary">
                <i class="bi bi-check-circle"></i> Guardar cambios
            </button>
            <a href="listar_productos.html" class="btn btn-outline-secondary">Cancelar</a>
        </div>
    </form>

    <script src="../../../assets/vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
    <script src="../../../assets/js/editar_producto.js"></script>
</body>
</html>
