<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar contraseña - Control Store</title>
    <link rel="stylesheet" href="../../assets/vendor/bootstrap/css/bootstrap.min.css">
    <link rel="stylesheet" href="../../assets/vendor/bootstrap-icons/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../../assets/css/styles.css">
</head>
<body>
    

    <div class="d-flex align-items-center justify-content-center min-vh-100 bg-light">
        <div class="card shadow-sm login-card">
            <div class="card-body p-4">

                <div class="text-center mb-4">
                    <i class="bi bi-shop text-primary login-icon"></i>
                    <h1 class="h4 mt-2">Recuperar contraseña</h1>
                    <p class="text-muted mb-0">Te enviaremos un enlace a tu correo para recuperar el acceso</p>
                </div>

                <!-- Mensaje que se muestra SIEMPRE al enviar, exista o no el correo (por seguridad) -->
                <div id="recuperarAlerta" class="alert alert-success d-none" role="alert">
                    Se envió un enlace a su correo
                </div>

                <form id="formRecuperar" novalidate>
                    <div class="mb-3">
                        <label for="correo" class="form-label">Correo electrónico registrado</label>
                        <input type="email" class="form-control" id="correo" name="correo" required>
                        <div class="invalid-feedback">Este campo es obligatorio</div>
                    </div>

                    <button type="submit" class="btn btn-primary w-100">Enviar enlace de recuperación</button>
                </form>

                <div class="text-center mt-3">
                    <a href="login.html" class="small">Volver a iniciar sesión</a>
                </div>

            </div>
        </div>
    </div>

    <script src="../../assets/vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
    <script src="../../assets/js/recuperar_contrasena.js"></script>
</body>
</html>
